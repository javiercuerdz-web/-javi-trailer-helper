<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Javi Trailer Helper</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="apple-touch-icon" href="icon.svg" />
</head>
<body>
  <header>
    <h1>Javi Trailer Helper</h1>
    <p>Search a trailer and tap any value to copy it.</p>
  </header>

  <main>
    <section class="toolbar">
      <input id="search" type="search" placeholder="Search trailer number" autocomplete="off" />
      <button id="addTrailerBtn" class="primary">Add Trailer</button>
    </section>

    <section id="trailerList" class="trailer-list"></section>

    <section id="editor" class="editor hidden">
      <div class="editor-head">
        <h2 id="editorTitle">Trailer</h2>
        <button id="closeEditorBtn" class="ghost">Close</button>
      </div>

      <div id="fields" class="fields"></div>

      <label class="notes-label" for="repairNotes">Repair Notes</label>
      <textarea id="repairNotes" rows="5" placeholder="Enter repair notes"></textarea>

      <div class="actions">
        <button id="copyNotesBtn">Copy Notes</button>
        <button id="copyEverythingBtn">Copy Everything</button>
        <button id="saveBtn" class="primary">Save</button>
        <button id="completeBtn">Mark Complete</button>
        <button id="deleteBtn" class="danger">Delete</button>
      </div>
    </section>

    <section class="import-export">
      <h2>Daily Data</h2>
      <textarea id="jsonBox" rows="7" placeholder='Paste trailer JSON here'></textarea>
      <div class="actions">
        <button id="importBtn">Import</button>
        <button id="exportBtn">Export</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
